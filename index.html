<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相纸机</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="相纸机">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Long+Cang&family=Zhi+Mang+Xing&display=swap">
<style>
  /* Layout: a camera back. Live card viewfinder on a dark table, shutter row, film chips, settings. Single dark look by choice. */
  :root {
    --body: #141518;
    --panel: #1f2126;
    --panel-2: #292c33;
    --line: #363a42;
    --fg: #ecebe6;
    --muted: #9a9ca4;
    --accent: #f0c36a;
    --accent-ink: #2a2110;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --font-hand: "Long Cang", "Kaiti SC", "STKaiti", "KaiTi", cursive;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { background: var(--body); color: var(--fg); }
  body {
    margin: 0;
    font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 40px;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  input[type="text"] { -webkit-user-select: text; user-select: text; }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 21px; letter-spacing: .02em; font-weight: 700; }
  .readout { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .readout b { color: var(--accent); font-weight: 600; }

  .table {
    position: relative; border-radius: 18px;
    background: radial-gradient(120% 90% at 50% 30%, #2a2c32 0%, #151619 70%);
    border: 1px solid var(--line);
    padding: 26px 12px 34px;
    display: grid; place-items: center; min-height: 280px;
  }
  .table.light { background: radial-gradient(120% 90% at 50% 30%, #e6e3dc 0%, #b4b1a9 78%); border-color: #8f8c85; }
  .card { position: relative; box-shadow: 0 12px 26px rgba(0,0,0,.55); }
  .table.light .card { box-shadow: 0 10px 22px rgba(40,34,26,.45), 0 2px 5px rgba(40,34,26,.3); }
  #frameCv { position: absolute; left: 0; top: 0; display: block; pointer-events: none; }
  #gl { position: absolute; display: block; touch-action: none; cursor: grab; background: #222; }
  .win { position: absolute; pointer-events: none; box-shadow: inset 1.5px 1.5px 2px rgba(0,0,0,.38); }
  .win.grid {
    background-image:
      linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.667% - .5px), rgba(255,255,255,.55) calc(66.667% - .5px), rgba(255,255,255,.55) calc(66.667% + .5px), transparent calc(66.667% + .5px)),
      linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.667% - .5px), rgba(255,255,255,.55) calc(66.667% - .5px), rgba(255,255,255,.55) calc(66.667% + .5px), transparent calc(66.667% + .5px));
  }
  .card .cap { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-hand); color: rgba(28,32,58,.88); white-space: nowrap; overflow: hidden; transform: rotate(-.7deg); pointer-events: none; }
  .card.dark .cap { color: rgba(240,238,230,.9); }
  .card.hand-marker .cap { font-family: "Zhi Mang Xing", "Kaiti SC", "STKaiti", cursive; }
  .tool { position: absolute; left: 12px; top: 6px; width: 30px; height: 24px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); cursor: pointer; padding: 0; }
  .tool[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .lenses { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); display: flex; gap: 6px; }
  .lenses button { appearance: none; min-width: 38px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(18,18,20,.78); color: #e8e7e2; font-family: var(--font-data); font-size: 11.5px; cursor: pointer; }
  .lenses button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #flashBtn[aria-pressed="true"] svg path { fill: currentColor; }
  .seg.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .seg.scroll::-webkit-scrollbar { display: none; }
  .seg.scroll button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); display: inline-block; }
  .badge { position: absolute; right: 12px; top: 6px; font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .badge.live { color: #9be3a5; }
  .badge.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5fd06f; margin-right: 6px; vertical-align: 1px; }
  .flashpop { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .35s ease-out; }

  .shutter-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .side { display: flex; gap: 8px; }
  .side.right { justify-content: flex-end; }
  .icon-btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 14px; min-width: 52px; height: 52px; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .icon-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .shutter {
    appearance: none; width: 76px; height: 76px; border-radius: 50%; cursor: pointer;
    border: 4px solid var(--fg); background: var(--body); padding: 5px;
  }
  .shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--fg); transition: transform .12s; }
  .shutter:active span { transform: scale(.88); }
  .shutter:disabled { opacity: .45; }
  .shutter-label { text-align: center; font-size: 11px; color: var(--muted); margin-top: -6px; }

  .formats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .formats::-webkit-scrollbar { display: none; }
  .fmt {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px;
    padding: 10px 10px 8px; min-width: 74px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); color: var(--fg); cursor: pointer; font: inherit;
  }
  .fmt[aria-pressed="true"] { border-color: var(--accent); background: var(--panel-2); }
  .fmt .thumb { display: grid; place-items: start center; background: #f3f1ea; border-radius: 2px; }
  .fmt .thumb i { display: block; background: #6f8094; }
  .fmt .nm { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .fmt .rt { font-family: var(--font-data); font-size: 10px; color: var(--muted); }

  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row label, .row .lb { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
  .row .val { font-family: var(--font-data); font-size: 12px; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
  input[type="text"] { width: 100%; min-width: 0; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 16px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--body); border-color: var(--fg); }
  button:focus-visible, input:focus-visible, label.icon-btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .note { font-size: 12px; color: var(--muted); line-height: 1.75; margin: 0; }
  .msg { font-size: 12.5px; line-height: 1.7; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0; }

  .sheet {
    position: fixed; inset: 0; z-index: 30; background: rgba(9,9,11,.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .print { position: relative; width: min(100%, 460px); max-height: 64vh; }
  .print img { display: block; width: 100%; height: auto; max-height: 64vh; object-fit: contain; box-shadow: 0 14px 36px rgba(0,0,0,.6); -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  .develop { position: absolute; pointer-events: none; opacity: 1; }
  .develop.go { opacity: 0; transition: opacity 5.5s cubic-bezier(.55,.05,.35,1); }
  .sheet p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; max-width: 34em; line-height: 1.7; }
  .sheet .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 420px); }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 14px; padding: 14px 12px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .toast { font-size: 13px; color: var(--accent); min-height: 1.2em; text-align: center; }

  @media (prefers-reduced-motion: reduce) { .develop.go { transition: none; } .flashpop { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>相纸机</h1>
    <div class="readout" id="readout"></div>
  </header>

  <div class="table" id="table">
    <div class="card" id="card">
      <canvas id="frameCv"></canvas>
      <canvas id="gl" aria-label="取景器，拖动移动画面，双指缩放"></canvas>
      <div class="win" id="win"></div>
      <div class="cap" id="capPreview"></div>
    </div>
    <button class="tool" id="gridBtn" type="button" aria-label="网格" aria-pressed="true" title="网格">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>
    </button>
    <span class="badge" id="badge">示例画面</span>
    <div class="lenses" id="lenses" role="group" aria-label="镜头" hidden></div>
  </div>

  <p class="msg" id="msg" hidden></p>

  <div class="shutter-row">
    <div class="side">
      <label class="icon-btn" for="file" aria-label="从相册选照片" title="相册"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg></label>
      <input id="file" type="file" accept="image/*" hidden>
      <button class="icon-btn" id="flip" type="button" aria-label="切换前后摄像头" title="翻转" hidden><svg viewBox="0 0 24 24"><path d="M19.5 10.5A7.8 7.8 0 0 0 5.3 7.2"/><path d="M4.5 3.8v3.7h3.7"/><path d="M4.5 13.5a7.8 7.8 0 0 0 14.2 3.3"/><path d="M19.5 20.2v-3.7h-3.7"/><rect x="8.6" y="10" width="6.8" height="4.6" rx="1"/></svg></button>
    </div>
    <button class="shutter" id="shutter" type="button" aria-label="拍摄"><span></span></button>
    <div class="side right">
      <button class="icon-btn" id="flashBtn" type="button" aria-pressed="false" aria-label="闪光灯" title="闪光"><svg viewBox="0 0 24 24"><path d="M13 2.5 4.8 13.4H11L10.2 21.5l8.3-11h-6.3z"/></svg></button>
      <button class="icon-btn" id="camBtn" type="button" aria-label="打开相机" title="相机"></button>
    </div>
  </div>
  <div class="shutter-label" id="shutterLabel">冲印这张</div>

  <div class="formats" id="formats" role="group" aria-label="相纸画幅"></div>

  <div class="controls">
    <div class="row">
      <label for="zoom">缩放</label>
      <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
      <span class="val" id="zoomVal">1.00×</span>
    </div>
    <div class="row">
      <label for="strength">胶片感</label>
      <input id="strength" type="range" min="0" max="100" step="1" value="100">
      <span class="val" id="strengthVal">100</span>
    </div>
    <div class="row">
      <span class="lb">边框</span>
      <div class="seg scroll" id="frameSeg"></div>
      <span></span>
    </div>
    <div class="row">
      <label for="caption">手写字</label>
      <input id="caption" type="text" maxlength="24" placeholder="想写点什么就填在这里，不填就没有">
      <span></span>
    </div>
    <div class="row" id="fontRow" hidden>
      <span class="lb">字体</span>
      <div class="seg" id="fontSeg">
        <button type="button" data-v="Long Cang" aria-pressed="true">钢笔</button>
        <button type="button" data-v="Zhi Mang Xing" aria-pressed="false">马克笔</button>
      </div>
      <span></span>
    </div>
  </div>

  <p class="note" id="fmtNote"></p>
  <p class="note">取景框里拖动可以移动画面，双指可以放大。每次按快门，色温、曝光和边缘显影痕迹都会随机偏一点，和真相纸一样，没有两张完全相同。</p>
</div>

<div class="flashpop" id="flashpop"></div>

<div class="sheet" id="sheet" hidden>
  <div class="print" id="print">
    <img id="result" alt="冲印好的相纸">
    <div class="develop" id="develop"></div>
  </div>
  <p id="sheetTip">相纸显影中，等几秒颜色就出来了。</p>
  <div class="btns">
    <button class="btn" id="again" type="button">再来一张</button>
    <button class="btn primary" id="save" type="button">存到相册</button>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------- formats (mm). Image area starts `top` from the top edge and `side` from the left. ----------
  const FORMATS = [
    { id: 'spectra', name: 'Spectra', w: 103, h: 101, iw: 90, ih: 73, top: 6, side: 6.5, corner: 1.2, film: 'spectra',
      note: 'Polaroid Spectra（Image）：整张 103 × 101 mm，画面 90 × 73 mm，横版，比例约 1.23 : 1。和 600 同一类相纸化学，色调相同，只是更柔、更灰一点。' },
    { id: 'itype', name: 'i-Type', w: 88.47, h: 107.52, iw: 78.94, ih: 76.8, top: 5, side: 4.765, corner: 1.2, film: 'polaroid',
      note: 'Polaroid i-Type 和 600：整张 88.5 × 107.5 mm，画面 79 × 77 mm。色调（按 60 张真实扫描片测出来的）：黑色抬得很高、发青，白色压暗、偏奶黄，颜色只有手机原片的七成左右，红色往洋红偏，绿色往青偏。画面很柔，几乎看不到颗粒。' },
    { id: 'go', name: 'Go', w: 53.9, h: 66.6, iw: 46, ih: 47, top: 4, side: 3.95, corner: 1, film: 'polaroid',
      note: 'Polaroid Go：整张 53.9 × 66.6 mm，画面 46 × 47 mm。用的是和 i-Type 同一类相纸化学，色调相同，只是更小。' },
    { id: 'mini', name: 'mini', w: 54, h: 86, iw: 46, ih: 62, top: 5, side: 4, corner: 3, film: 'instax',
      note: 'Instax mini：整张 54 × 86 mm，画面 46 × 62 mm。色调（按 70 张真实扫描片测出来的）：比宝丽来对比强、黑得更实，暗部偏红棕，亮部偏冷，颜色比手机原片素两成，红色往洋红偏。开闪光会很“冲”。' },
    { id: 'square', name: 'SQUARE', w: 72, h: 86, iw: 62, ih: 62, top: 5, side: 5, corner: 3, film: 'instax',
      note: 'Instax SQUARE：整张 72 × 86 mm，画面 62 × 62 mm，正方形，色调和 mini 一样。' },
    { id: 'wide', name: 'WIDE', w: 108, h: 86, iw: 99, ih: 62, top: 5, side: 4.5, corner: 3, film: 'instax',
      note: 'Instax WIDE：整张 108 × 86 mm，画面 99 × 62 mm，比例约 1.6 : 1，很扁，色调和 mini 一样。' }
  ];

  // ---------- film looks ----------
  // Colour values were fitted, not guessed: about 60 Polaroid and 70 Instax scans from Flickr were measured
  // (black and white point per channel, cast of near-neutral tones in shadows, mids and highlights, chroma, hue of reds,
  // greens and blues), then these numbers were solved so that ordinary phone photos run through the shader land on
  // the same statistics. Blue chroma boost was cut back by hand because the raw fit made blue clothes look purple.
  //   expo, warm, tint: exposure and white balance before everything else.
  //   sat: overall chroma. hue: degrees to turn reds, greens, blues. hueSat: extra chroma for reds, greens, blues.
  //   mid: Oklab a and b nudge in the midtones (x0.01). curve: S-curve strength (1 = smoothstep).
  //   blk, wht: black and white point of each channel after the curve. Polaroid: cyan blacks, warm whites.
  //   Instax: red-brown blacks, slightly cool whites.
  //   blur, clarity (< 0 flattens local contrast), bloom, vig, edge (uneven chemistry at the window), grain.
  //   develop: colour of an undeveloped print.
  const FILMS = {
    polaroid: { expo: 1.005, warm: 0.002, tint: 0, sat: 0.85, hue: [-11.9, 14.9, 8.5], hueSat: [-0.03, 0.07, 0.25], mid: [0.5, -0.46],
                curve: 0.44, blk: [0.072, 0.108, 0.117], wht: [0.956, 0.901, 0.879],
                blur: 0.0022, clarity: -0.28, bloom: 0.30, bloomCol: [1.0, 0.88, 0.84],
                vig: 0.30, edge: 0.75, edgeCol: [0.78, 0.80, 0.86], grain: 0.005, develop: '#b4bcb4' },
    instax:   { expo: 1.09, warm: -0.048, tint: -0.003, sat: 0.88, hue: [-24.3, 8.0, 15.5], hueSat: [-0.03, -0.12, 0.30], mid: [0.01, -1.65],
                curve: 1.15, blk: [0.130, 0.076, 0.054], wht: [0.885, 0.898, 0.886],
                blur: 0.0014, clarity: -0.12, bloom: 0.16, bloomCol: [1.0, 1.0, 0.98],
                vig: 0.18, edge: 0.0, edgeCol: [1, 1, 1], grain: 0.011, develop: '#1e2024' }
  };
  // Spectra uses the same Polaroid chemistry; a little softer and flatter.
  FILMS.spectra = Object.assign({}, FILMS.polaroid, { sat: 0.82, curve: 0.38, blur: 0.0021, clarity: -0.30, edge: 0.65, edgeCol: [0.80, 0.82, 0.90], grain: 0.006, develop: '#a9b4b0' });

  // ---------- frame colours. dark: light ink and a light table so the card stands out ----------
  const FRAMES = [
    { id: 'white',   name: '白',   c: '#f4f2eb' },
    { id: 'black',   name: '黑',   c: '#1c1c1e', dark: true },
    { id: 'cream',   name: '奶油', c: '#ede2c9' },
    { id: 'pink',    name: '樱粉', c: '#f0c3cc' },
    { id: 'blue',    name: '天蓝', c: '#a7cae5' },
    { id: 'mint',    name: '薄荷', c: '#b6dbc5' },
    { id: 'yellow',  name: '柠檬', c: '#f1d470' },
    { id: 'red',     name: '砖红', c: '#b5422f', dark: true },
    { id: 'navy',    name: '藏青', c: '#233150', dark: true },
    { id: 'silver',  name: '银',   c: '#c4c7cc', metal: true },

    } else if (pts.size === 2 && pinch0 > 0) { const [a, b] = [...pts.values()]; setZoom(zoom0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch0); }
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0; };
  glc.addEventListener('pointerup', up); glc.addEventListener('pointercancel', up);
  function setZoom(z) { state.zoom = Math.min(3, Math.max(1, z)); $('zoom').value = state.zoom; $('zoomVal').textContent = state.zoom.toFixed(2) + '×'; updateBadge(); dirty = true; }

  // ---------- controls ----------
  $('zoom').addEventListener('input', e => setZoom(+e.target.value));
  $('strength').addEventListener('input', e => { state.strength = e.target.value / 100; $('strengthVal').textContent = e.target.value; dirty = true; });
  $('caption').addEventListener('input', e => { state.caption = e.target.value; sync(); });
  function seg(id, key) {
    $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v;
      $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); sync(); });
  }
  seg('fontSeg', 'font');
  FRAMES.forEach(fr => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.v = fr.id;
    const bg = fr.rainbow ? 'linear-gradient(135deg,' + RAINBOW.join(',') + ')' : fr.metal ? 'linear-gradient(135deg,#a9adb3,#eceef1,#b4b8be)' : fr.c;
    b.innerHTML = '<i class="sw" style="background:' + bg + '"></i>' + fr.name;
    b.addEventListener('click', () => { state.frame = fr.id; store.set('frame', fr.id); sync(); paintPreviewFrame(); });
    $('frameSeg').appendChild(b);
  });

  // ---------- shoot & develop ----------
  const paperTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const d = g.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 60; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; } g.putImageData(d, 0, 0); return c; })();
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  // big soft blotches: the uneven body of real card stock
  const blotchTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 36; const g = c.getContext('2d'); const d = g.createImageData(36, 36);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 80; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; } g.putImageData(d, 0, 0); return c; })();

  // Paint the card: base colour, paper body, fine tooth, satin sheen, lit cut edge, raised lip round the image window.
  // K = canvas pixels per millimetre.
  function paintFrame(g, W, H, f, fr, K) {
    const r = f.corner * K * 0.6;
    g.clearRect(0, 0, W, H);
    g.save(); rr(g, 0, 0, W, H, r); g.clip();
    if (fr.rainbow) { const lg = g.createLinearGradient(0, 0, W, H); RAINBOW.forEach((col, i) => lg.addColorStop(i / (RAINBOW.length - 1), col)); g.fillStyle = lg; }
    else if (fr.metal) { const lg = g.createLinearGradient(0, 0, W * 0.8, H); [[0, '#a7abb1'], [.2, '#e8eaed'], [.42, '#b5b9bf'], [.66, '#e1e4e8'], [1, '#9fa3a9']].forEach(([s, col]) => lg.addColorStop(s, col)); g.fillStyle = lg; }
    else g.fillStyle = fr.c;
    g.fillRect(0, 0, W, H);
    g.imageSmoothingEnabled = true;
    g.globalCompositeOperation = 'soft-light';
    g.globalAlpha = fr.dark ? 0.10 : 0.14; g.drawImage(blotchTex, 0, 0, W, H);
    g.globalAlpha = fr.dark ? 0.30 : 0.20; g.fillStyle = g.createPattern(paperTex, 'repeat'); g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    if (fr.metal) { for (let y = 0; y < H; y += Math.max(1, K * 0.08)) { g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.07).toFixed(3) + ')'; g.fillRect(0, y, W, Math.max(1, K * 0.04)); } }
    // satin sheen: a soft band of light from the upper left, a touch of shade toward the lower right
    const sh = g.createLinearGradient(0, 0, W, H);
    sh.addColorStop(0, 'rgba(255,255,255,' + (fr.dark ? 0.11 : 0.20) + ')');
    sh.addColorStop(0.38, 'rgba(255,255,255,' + (fr.dark ? 0.04 : 0.05) + ')');
    sh.addColorStop(0.62, 'rgba(0,0,0,0)');
    sh.addColorStop(1, 'rgba(0,0,0,' + (fr.dark ? 0.28 : 0.07) + ')');
    g.fillStyle = sh; g.fillRect(0, 0, W, H);
    if (fr.dark) { const sp = g.createRadialGradient(W * 0.22, H * 0.12, 0, W * 0.22, H * 0.12, Math.max(W, H) * 0.7); sp.addColorStop(0, 'rgba(255,255,255,.07)'); sp.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sp; g.fillRect(0, 0, W, H); }
    // the die-cut edge catches light
    g.lineWidth = Math.max(1, K * 0.28); g.strokeStyle = fr.dark ? 'rgba(255,255,255,.17)' : 'rgba(255,255,255,.55)';
    rr(g, g.lineWidth / 2, g.lineWidth / 2, W - g.lineWidth, H - g.lineWidth, r); g.stroke();
    // lip round the image window: lit on the lower and right side, shaded on the upper and left
    const x = f.side * K, y = f.top * K, w = f.iw * K, h = f.ih * K, t = Math.max(1, K * 0.22);
    g.fillStyle = fr.dark ? 'rgba(255,255,255,.13)' : 'rgba(255,255,255,.6)';
    g.fillRect(x, y + h, w + t, t); g.fillRect(x + w, y, t, h);
    g.fillStyle = fr.dark ? 'rgba(0,0,0,.45)' : 'rgba(70,60,50,.22)';
    g.fillRect(x - t, y - t, w + t, t); g.fillRect(x - t, y, t, h);
    g.restore();
  }
  // inner shadow the lip casts onto the picture
  function paintWindowShade(g, x, y, w, h, K) {
    const t = K * 0.9;
    let lg = g.createLinearGradient(0, y, 0, y + t); lg.addColorStop(0, 'rgba(0,0,0,.42)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = lg; g.fillRect(x, y, w, t);
    lg = g.createLinearGradient(x, 0, x + t, 0); lg.addColorStop(0, 'rgba(0,0,0,.32)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = lg; g.fillRect(x, y, t, h);
  }
  function paintPreviewFrame() {
    const f = state.fmt, fc = $('frameCv'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    fc.width = Math.round(f.w * k * dpr); fc.height = Math.round(f.h * k * dpr);
    fc.style.width = (f.w * k) + 'px'; fc.style.height = (f.h * k) + 'px';
    paintFrame(fc.getContext('2d'), fc.width, fc.height, f, frameOf(), k * dpr);
  }

  let lastFile = null;
  async function shoot() {
    const btn = $('shutter'); btn.disabled = true;
    if (state.flash) { const fp = $('flashpop'); fp.style.transition = 'none'; fp.style.opacity = '0.9'; requestAnimationFrame(() => { fp.style.transition = ''; fp.style.opacity = '0'; }); }
    if (document.fonts && state.caption.trim()) { try { await document.fonts.load('40px "' + state.font + '"', state.caption); } catch (e) {} }
    const f = state.fmt, K = 14; // px per mm, about 355 dpi
    const W = Math.round(f.w * K), H = Math.round(f.h * K);
    const ix = Math.round(f.side * K), iy = Math.round(f.top * K), iw = Math.round(f.iw * K), ih = Math.round(f.ih * K);
    // every print drifts a little, like real chemistry
    const seed = Math.random() * 10, warm = (Math.random() - 0.5) * 0.05, expo = 1 + (Math.random() - 0.5) * 0.08;
    draw(iw, ih, { seed, warm, expo });
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const c = out.getContext('2d');
    const fr = frameOf();
    paintFrame(c, W, H, f, fr, K);
    c.drawImage(glc, ix, iy, iw, ih);
    paintWindowShade(c, ix, iy, iw, ih, K);
    const text = state.caption.trim();
    if (text) {
      const bottom = f.h - f.top - f.ih; let size = Math.min(bottom * 0.42, 9) * K;
      const fam = '"' + state.font + '", "Kaiti SC", "STKaiti", "KaiTi", cursive';
      c.font = size + 'px ' + fam; const maxW = (f.w - f.side * 4) * K, tw = c.measureText(text).width;
      if (tw > maxW) { size *= maxW / tw; c.font = size + 'px ' + fam; }
      c.save(); c.translate(W / 2, (f.top + f.ih + bottom * 0.52) * K); c.rotate(-0.012);
      c.fillStyle = fr.dark ? 'rgba(240,238,230,.9)' : 'rgba(28,32,58,.88)'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(text, 0, 0); c.restore();
    }
    layout(); // restore viewfinder size
    const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', 0.95));
    lastFile = new File([blob], '相纸-' + f.id + '-' + Date.now() + '.jpg', { type: 'image/jpeg' });
    const img = $('result'); if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
    img.dataset.url = URL.createObjectURL(blob); img.src = img.dataset.url;
    const dv = $('develop');
    Object.assign(dv.style, { left: (f.side / f.w * 100) + '%', top: (f.top / f.h * 100) + '%', width: (f.iw / f.w * 100) + '%', height: (f.ih / f.h * 100) + '%', background: FILMS[f.film].develop });
    dv.classList.remove('go'); void dv.offsetWidth;
    $('toast').textContent = ''; $('sheetTip').textContent = '相纸显影中，等几秒颜色就出来了。';
    $('sheet').hidden = false;
    img.onload = () => requestAnimationFrame(() => dv.classList.add('go'));
    setTimeout(() => { $('sheetTip').textContent = '点“存到相册”，在弹出的菜单里选“存储图像”。也可以长按图片保存。'; }, 4200);
    btn.disabled = false;
  }
  $('shutter').addEventListener('click', shoot);
  $('again').addEventListener('click', () => { $('sheet').hidden = true; });

  const downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  $('save').addEventListener('click', async () => {
    if (!lastFile) return;
    if (navigator.canShare && navigator.share) {
      let ok = false; try { ok = navigator.canShare({ files: [lastFile] }); } catch (e) {}
      if (ok) {
        try { await navigator.share({ files: [lastFile] }); $('toast').textContent = ''; return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
      }
    }
    const dl = await downloadsP;
    if (dl) {
      try { await dl.save({ filename: lastFile.name, data: lastFile }); $('toast').textContent = '已交给系统保存'; return; }
      catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { $('toast').textContent = '上一次保存还没处理完，稍等再点'; return; } }
    }
    $('toast').textContent = '这里没法直接保存，请长按图片，选“存储到照片”';
  });

  // ---------- sample scene so the first view already shows the look ----------
  function makeSample() {
    const c = document.createElement('canvas'); c.width = 1600; c.height = 1200; const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, 720); sky.addColorStop(0, '#4f7fbf'); sky.addColorStop(.55, '#9fb9d6'); sky.addColorStop(1, '#f2d2a6');
    g.fillStyle = sky; g.fillRect(0, 0, 1600, 720);
    const sun = g.createRadialGradient(1120, 520, 10, 1120, 520, 230); sun.addColorStop(0, 'rgba(255,250,230,1)'); sun.addColorStop(.25, 'rgba(255,236,190,.9)'); sun.addColorStop(1, 'rgba(255,220,170,0)');
    g.fillStyle = sun; g.fillRect(800, 250, 640, 560);
    const hill = (y, a, col, s) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, 1200); for (let x = 0; x <= 1600; x += 16) g.lineTo(x, y + Math.sin(x / 200 + s) * a + Math.sin(x / 70 + s * 2) * a * .25); g.lineTo(1600, 1200); g.fill(); };
    hill(620, 46, '#7d86a0', 1); hill(680, 36, '#4f6e5a', 3); hill(760, 24, '#3d5c40', 6);
    const field = g.createLinearGradient(0, 780, 0, 1200); field.addColorStop(0, '#6f9a4e'); field.addColorStop(1, '#2f4a26');
    g.fillStyle = field; g.fillRect(0, 800, 1600, 400);
    g.fillStyle = '#c94a3a'; g.fillRect(380, 690, 170, 120); g.fillStyle = '#e9e4d8'; g.beginPath(); g.moveTo(360, 700); g.lineTo(465, 630); g.lineTo(570, 700); g.fill();
    g.fillStyle = '#f2efe6'; g.fillRect(440, 740, 40, 70);
    for (let i = 0; i < 260; i++) { g.fillStyle = ['#f5d547', '#ffffff', '#e86a7a'][i % 3]; g.beginPath(); g.arc(Math.random() * 1600, 860 + Math.random() * 340, 3 + Math.random() * 5, 0, Math.PI * 2); g.fill(); }
    return c;
  }

  buildFormats(); sync(); layout();
  window.addEventListener('resize', layout);
  requestAnimationFrame(loop);
  // try the camera straight away where it can work; otherwise stay on the sample
  if (window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && !(window.claude && window.claude.use)) startCamera();
})();
</script>
</body>
